name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "hotfix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: install / build / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check lib matches src
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            echo "lib/ is out of date: run pnpm build and commit lib/ with the change." >&2
            git status --porcelain -- lib >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
